# Campaign rules. Don't copy this file: switch campaigns on with
#   python -m clipbot enable <id> --joined YYYY-MM-DD
# Your settings are saved to campaigns.yaml (out of git); `git pull` updates these rules.
#
# A campaign is only used when ALL of these are true:
#   active: true, permission.type is campaign|written|own, permission.evidence is filled in,
#   and expires_on (if set) hasn't passed.
# Enable a campaign only after you've actually joined it and read its rules page.
# Values marked CHECK came from the campaign listing; confirm them on the rules page,
# which is the source of truth (rules change, budgets run out).
#
# inputs[].type:
#   twitch / kick       live channel (target = login or URL). Recorded only if allow_recording: true.
#   youtube_video       one approved video (target = URL)
#   youtube_channel     newest uploads from an approved channel (target = channel URL)
#   folder              local folder of approved footage, e.g. a downloaded/synced Google Drive folder
# platforms: where clips may be posted: tiktok, instagram, youtube, x (x = manual for now)

defaults: &defaults
  active: false
  ad_disclosure: false
  ai_text_allowed: true
  clip_preapproval: false
  min_clip_seconds: 15
  max_clip_seconds: 60

gta_campaign: &gta_campaign
  active: false
  game_filter: gta6   # Twitch category "Grand Theft Auto VI" only; GTA V streams are skipped
  allow_recording: true
  platforms: [tiktok, instagram, youtube]
  ai_text_allowed: false          # Reach: assume AI-generated content is banned
  ad_disclosure: true             # "#ad" on screen at the start + in caption (campaign posts need it)
  require_review: true            # one strike = banned from every Reach campaign
  post_hours: "10-23"
  submit_within_minutes: 30
  min_clip_seconds: 15
  max_clip_seconds: 60
  series: gta6

gta_tolerated: &gta_tolerated
  active: false
  permission: {type: tolerated, evidence: ""}
  game_filter: gta6   # Twitch category "Grand Theft Auto VI" only; GTA V streams are skipped
  allow_recording: true
  platforms: [tiktok, instagram, youtube]
  ai_text_allowed: true
  require_review: true
  min_clip_seconds: 15
  max_clip_seconds: 60
  series: gta6

campaigns:
  # ===================== GTA 6 (launch 2026-11-19): your main focus =====================
  # From the streamer research of 2026-11-18. No streamer publishes a written clipping policy;
  # paid campaigns are the safe way in. Full rules unlock when you join on Content Rewards:
  # read each brief, then: python -m clipbot enable <id> --joined YYYY-MM-DD
  # Reach campaigns: assume AI-generated content is banned, add an ad disclosure, credit the streamer.
  # Avoid isolated GTA 6 story cutscenes/endings (Rockstar removes them): gameplay + reactions only.

  # ---- Tier 1: paid campaigns ----
  - id: kai-cenat-gta
    name: Kai Cenat $10K (Reach)
    <<: *gta_campaign
    permission: {type: campaign, evidence: "https://contentrewards.com/c/campaigns/44a3ffcb-d4a1-492b-94a4-704919950246"}
    inputs:
      - {type: twitch, target: kaicenat}
    title_template: "Kai Cenat in GTA 6"
    required_hashtags: ["#KaiCenat", "#GTA6"]
    budget: {total: 10000}
    notes: "Pool by views. Rules: https://reachclipping.com/KaiCenat (read for required tags). Full playthrough from Nov 18 8 PM ET."

  - id: lacy-gta
    name: Lacy $25K 30-day (Reach)
    <<: *gta_campaign
    permission: {type: campaign, evidence: "https://contentrewards.com/c/campaigns/4479e5e2-9a00-489e-8b0c-345834f37cc7"}
    inputs:
      - {type: twitch, target: lacy}
    title_template: "Lacy in GTA 6"
    required_hashtags: ["#Lacy", "#GTA6"]
    budget: {total: 25000}
    notes: >-
      Rules: https://reachclipping.com/Lacy. Also look for the "LACY GTA VI Marathon Pool" ($12.5K, 1M MVR)
      on contentrewards.com/c/discover and the X-only campaign (lacy-x). CORE clips can be submitted here too.

  - id: lacy-x
    name: Lacy $5K X-only (Reach)
    <<: *gta_campaign
    permission: {type: campaign, evidence: "https://contentrewards.com/c/campaigns/20b7c977-8d0c-4bd0-b9b0-2db9200f405b"}
    inputs:
      - {type: twitch, target: lacy}
    platforms: [x]
    title_template: "Lacy in GTA 6"
    required_hashtags: ["#Lacy", "#GTA6"]
    budget: {total: 5000}

  - id: clix-gta
    name: Clix $5K (Reach)
    <<: *gta_campaign
    permission: {type: campaign, evidence: "https://contentrewards.com/c/campaigns/7a6a234b-1e9e-4da3-a600-54cc3142e710"}
    inputs:
      - {type: twitch, target: clix}
    title_template: "Clix in GTA 6"
    required_hashtags: ["#Clix", "#GTA6"]
    budget: {total: 5000}
    notes: >-
      Brief: "AI-generated videos are not allowed". Ask in Reach Discord that auto-cut stream clips are OK.
      Also look for the "Clix GTA VI Marathon Pool" ($5K, 400K MVR). 24/7 GTA 6 marathon from Nov 19.

  - id: jason
    name: JasonTheWeen (CORE pool)
    <<: *gta_campaign
    permission: {type: campaign, evidence: ""}   # TODO: link from Content Rewards once joined ($9K pool)
    inputs:
      - {type: twitch, target: jasontheween}
    title_template: "Jason in GTA 6"
    required_hashtags: ["#JasonTheWeen", "#GTA6"]

  - id: lysium
    name: Lysium / Benji Ramos (GTA RP)
    <<: *gta_campaign
    permission: {type: campaign, evidence: "https://contentrewards.com/discover/6d896f33-152f-42a9-92f4-662199228349"}
    inputs:
      - {type: twitch, target: lysium}           # CHECK login
    game_filter: "gta5, gta6"                    # their campaign is GTA RP, which runs on GTA V for now
    platforms: [tiktok, instagram, youtube, x]
    payout: {cpm: 1.5, min: 15, max: 150}
    clip_preapproval: true                       # every clip needs their OK before posting
    bio_link: https://twitch.tv/Lysium
    title_template: "Benji Ramos in GTA RP"
    content_rule: "Give context; no drama bait."

  - id: dasgasd3m-gta
    name: Dasgasd3m GTA VI (Ruckus)
    <<: *gta_campaign
    permission: {type: campaign, evidence: "https://whop.com/gta6clipping/"}
    inputs:
      - {type: twitch, target: dasgasd3m}        # CHECK platform/login
    platforms: [tiktok, youtube]
    payout: {cpm: 1.0, min: 10, max: 100}
    budget: {total: 1000}
    title_template: "Dom in GTA 6"
    notes: "Opens Nov 19. #ad required in caption AND on screen."

  - id: tomo-gta
    name: TOMO GTA VI (Clipping Nation)
    <<: *gta_campaign
    permission: {type: campaign, evidence: ""}   # TODO: link once joined (opened Nov 17)
    inputs:
      - {type: twitch, target: tomo}             # CHECK platform/login
    payout: {cpm: 2.0, min: 4, max: 150}
    budget: {total: 1000}
    title_template: "TOMO in GTA 6"

  # ---- Tier 2: tolerated, NO campaign (no payout from them; own-channel revenue only) ----
  # Clips of these are widely reposted with no known takedowns, but that's not permission.
  # Enabling one is your call: python -m clipbot enable <id> --evidence "tolerated: my decision"
  - id: xqc-gta
    name: xQc (tolerated)
    <<: *gta_tolerated
    inputs:
      - {type: kick, target: xqc}
      - {type: twitch, target: xqc}
    title_template: "xQc in GTA 6"
    required_hashtags: ["#xQc", "#GTA6"]

  - id: ludwig-gta
    name: Ludwig (tolerated)
    <<: *gta_tolerated
    inputs:
      - {type: youtube_live, target: "@ludwig"}
    title_template: "Ludwig in GTA 6"
    required_hashtags: ["#Ludwig", "#GTA6"]

  - id: gta-rp
    name: GTA RP channels (tolerated)
    <<: *gta_tolerated
    inputs:
      - {type: twitch, target: buddha}
      - {type: kick, target: lordkebun}
      - {type: twitch, target: dasmehdi}
      - {type: twitch, target: penta}
    game_filter: gta6
    title_template: "GTA RP moment"
    required_hashtags: ["#GTARP"]

  - id: jynxzi-gta
    name: Jynxzi (tolerated)
    <<: *gta_tolerated
    inputs:
      - {type: twitch, target: jynxzi}
    title_template: "Jynxzi in GTA 6"
    required_hashtags: ["#Jynxzi", "#GTA6"]

  # ---- Your own posts (announcements made with `python -m clipbot announce`) ----
  - id: own
    name: Your own posts
    <<: *defaults
    active: true
    permission: {type: own, evidence: "original posts you make yourself (no stream footage)"}
    inputs: []
    platforms: [tiktok, instagram, youtube, x]
    submit: false
    show_credit: false
    require_review: true

  # ---- Any live GTA stream (your own channels, no campaign) ----
  # Follows the biggest live GTA V / GTA 6 streams on Twitch that no campaign above covers
  # (streamers listed in another campaign, on or off, are never picked up here, so their
  # own rules apply). Clips go to your channels only, credited to the streamer, and are
  # never submitted to a campaign. Turn on: python -m clipbot enable gta-any
  - id: gta-any
    name: Any live GTA stream (own channels)
    <<: *gta_tolerated
    permission: {type: tolerated, evidence: "open GTA clipping: streamer credited on every clip, not submitted anywhere"}
    discover: true
    discover_limit: 4            # streams watched at once (each one uses ~6 Mbps download)
    discover_min_viewers: 300
    discover_exclude: [ishowspeed]   # Speed's team claims YouTube clips; see ishowspeed-gta
    language: any                # early GTA 6 players may stream in any language
    submit: false
    inputs: []
    title_template:              # rotated so the feed doesn't look copy-pasted
      - "{streamer} in GTA 6 😂"
      - "GTA 6 got {streamer} like 💀"
      - "{streamer} was NOT ready for this (GTA 6)"
      - "This GTA 6 moment from {streamer} 😭"
      - "{streamer} vs Vice City"
      - "Only in GTA 6… ({streamer})"
    required_hashtags: ["#GTA6", "#GTAVI"]
    content_rule: "Gameplay and reactions only. Skip story cutscenes, mission endings and story spoilers."

  # ---- Caution ----
  - id: ishowspeed-gta
    name: IShowSpeed (tolerated, NOT on YouTube)
    <<: *gta_tolerated
    inputs:
      - {type: youtube_live, target: "@IShowSpeed"}
    platforms: [tiktok, instagram]   # his team filed Content ID claims on YouTube clip channels before
    title_template: "Speed in GTA 6"
    required_hashtags: ["#IShowSpeed", "#GTA6"]

  # Adin Ross / N3on / DDG (Kick): private programs via their Discords; Adin Ross DMCA-struck a
  # YouTuber in 2023. Not added. Ask to join N3on's program if you want them.

  # ===================== Other campaigns (not GTA niche) =====================
  # Rules read 2026-11-18 (pasted from reachclipping.com/CORE).
  # Join: https://contentrewards.com/c/campaigns/2886f500-f062-48dd-a9b4-9de5725f8186
  - id: core-pool
    name: CORE $20K Pool
    <<: *defaults
    permission:
      type: campaign
      evidence: https://reachclipping.com/CORE
      joined_on:                   # fill in when you join
      expires_on: 2026-11-30       # pool ends 11/30/26
    # Any video, stream or clip with 2+ CORE members, EXCEPT the CORE YouTube channel
    # (that content belongs to the $5K core-yt-pool campaign).
    members:                       # CHECK the roster and Twitch logins
      - {name: Lacy, hashtag: "#Lacy", logins: [lacy]}
      - {name: Jason, hashtag: "#JasonTheWeen", logins: [jasontheween]}
      - {name: Stable Ronaldo, hashtag: "#StableRonaldo", logins: [stableronaldo]}
      - {name: Silky, hashtag: "#Silky", logins: [silky]}
      - {name: Marlon, hashtag: "#Marlon", logins: [marlon]}
    min_members: 2
    inputs:
      - {type: twitch, target: lacy}
      - {type: twitch, target: jasontheween}
      - {type: twitch, target: stableronaldo}
      - {type: twitch, target: silky}
      - {type: twitch, target: marlon}
      # CORE's TikTok/Instagram/X posts are also allowed sources: save them in this folder by hand.
      - {type: folder, target: "recordings/core-pool/manual"}
    game_filter: gta6  # your page is GTA 6, so only record their GTA VI streams
    allow_recording: true
    platforms: [tiktok, instagram, youtube, x]
    ai_text_allowed: false         # "AI-generated content ... removes you from every Reach campaign"
    title_template: "{members} in GTA 6 😂 | CORE"   # edit per clip to describe the moment
    required_words: [CORE]         # caption/overlay must mention CORE or member names
    required_hashtags: ["#CORE", "#GTA6"]           # + one hashtag per member in the clip (added automatically)
    show_credit: false             # no logos; keep on-screen text to what the rules ask for
    my_watermark: false            # "Logos of any kind are not allowed": no @ watermark either
    require_review: true           # one strike = banned from every Reach campaign
    post_hours: "10-23"            # submit each link within 30 min of posting, so post while awake
    submit_within_minutes: 30
    also_submit_to: [lacy-gta, lacy-x, jason]   # same clip can also be submitted to Lacy + JasonTheWeen campaigns
    ad_disclosure: true            # campaign posts need an ad disclosure at the start (text, not a logo)
    content_rule: >-
      At least 2 CORE members (Lacy, Jason, Stable Ronaldo, Silky, Marlon) must clearly appear or talk together.
      Funny moments, reactions, interactions, banter. Never portray CORE negatively, no false narratives,
      no hate farming. English only.
    budget: {total: 20000}
    series: gta6
    notes: >-
      Pool: $20K split by share of approved views, 2M total views minimum, paid when the campaign ends.
      Audience 50%+ US/CA/AU/UK/NZ. No collab posts, no reposts, no repetitive thumbnails.

  - id: core-yt-pool
    name: CORE YouTube $5K Pool
    <<: *defaults
    permission: {type: campaign, evidence: https://reachclipping.com/COREYT}
    inputs:
      - {type: youtube_channel, target: "https://www.youtube.com/@createownruneverything", max_videos: 5}
    platforms: [tiktok, instagram, youtube, x]
    my_watermark: false            # CORE rules ban logos; assume the same here until checked
    notes: "Pool campaign, MVR 700K total views. CHECK rules page."

  - id: tjr
    name: TJR
    <<: *defaults
    permission: {type: campaign, evidence: https://reachclipping.com/TJR}
    inputs:
      - {type: kick, target: tjr}
    allow_recording: true          # CHECK: the campaign names the Kick stream as the source
    platforms: [tiktok, instagram, youtube]
    payout: {cpm: 0.75, min: 3.75, max: 1000}

  - id: gumbo
    name: Gumbo
    <<: *defaults
    permission: {type: campaign, evidence: ""}   # TODO: paste the rules page URL
    inputs:
      - {type: kick, target: TODO_kick_login}
    allow_recording: true          # CHECK on rules page
    platforms: [tiktok, instagram, youtube]

  - id: social-media-justice
    name: Social Media Justice
    <<: *defaults
    permission: {type: campaign, evidence: https://reachclipping.com/SocialMediaJustice}
    inputs:
      - {type: youtube_video, target: "https://www.youtube.com/watch?v=6uSskUaDL90"}
    platforms: [tiktok, instagram, youtube]
    payout: {cpm: 2, min: 10, max: 750}
    bio_link: https://socialmediajusticereview.com/
    notes: "US-based creators only."

  - id: marlon
    name: Marlon $5K
    <<: *defaults
    permission: {type: campaign, evidence: https://reachclipping.com/Marlon}
    inputs:
      # Download the approved footage from the campaign's Google Drive folder into here.
      # (Keep the Drive password out of this file and out of git.)
      - {type: folder, target: "recordings/marlon/drive"}
    platforms: [tiktok, instagram]
    payout: {cpm: 2.5, min: 25, max: 300}

  # Rules read 2026-11-18. Needs a travel/streamer-niche account, so it doesn't fit a GTA page.
  - id: expedia-ishowspeed
    name: Expedia x IShowSpeed
    <<: *defaults
    permission: {type: campaign, evidence: https://reachclipping.com/Expedia-IShowSpeed}
    inputs:
      # Only the Expedia segment of the 11.6.26 stream, 2:46:29 to the end, is approved.
      - {type: youtube_video, target: "https://www.youtube.com/live/Kyv61l2vF6M", start_at: "2:46:29"}
    platforms: [tiktok, instagram, youtube]   # TikTok, Reels, Shorts only
    payout: {cpm: 1, min: 10, max: 500}       # MVR 10,000 views; payout after approval
    budget: {total: 8000, used: 535, checked: 2026-11-18}
    sponsor: Expedia
    ai_text_allowed: false         # "AI-generated content is prohibited"
    title_template: "IShowSpeed's Expedia trip"   # edit per clip: must name the destination accurately
    required_words: [Expedia]      # "the video must mention Expedia"
    required_hashtags: ["#IShowSpeed", "#Expedia"]
    show_credit: false             # no extra on-screen text/logos beyond Expedia's
    my_watermark: false            # no logos besides Expedia's
    ad_disclosure: true            # rules don't say, but paid brand promotion needs disclosure (FTC)
    require_review: true           # one strike = permanent ban from all Reach campaigns
    post_hours: "9-22"             # links must be submitted in Content Rewards within 30 min
    submit_within_minutes: 30
    content_rule: >-
      Expedia must be a major focus. Never portray IShowSpeed or Expedia negatively,
      no negative false narratives, nothing NSFW. English only.
    notes: >-
      Account must be streamer/travel niche with 50%+ audience in US/CA/AU/UK/NZ.
      Verify Whop (Settings > Connected Accounts). One strike = removed from every Reach campaign.
