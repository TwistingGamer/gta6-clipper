# Copy to sources.yaml and list ONLY streamers you are allowed to clip.
# A streamer without a valid permission block is ignored everywhere:
# no recording, no clipping, no posting.
#
# permission.type is one of:
#   campaign            - you joined their paid/official clipping campaign
#   written             - they (or their team) told you in writing you may clip & post
#   own                 - your own channel
#   public_clip_policy  - they publicly state anyone may clip & repost (keep the link)
# permission.evidence should be a link or a short note you could show if challenged.

streamers:
  - login: example_streamer          # Twitch login name (lowercase)
    display_name: ExampleStreamer
    permission:
      type: campaign
      evidence: "https://example.com/campaigns/examplestreamer-gta6  (joined 2026-11-18)"
      granted_on: 2026-11-18
      expires_on: 2026-12-31          # optional; leave blank if open-ended
    active: false                     # flip to true once the permission above is real
    allow_recording: false            # true only if they allow recording their live stream
    max_clip_seconds: 60              # campaign rules often cap length
    credit: "twitch.tv/example_streamer"   # shown on screen and in the description
    required_hashtags: ["#ExampleStreamer"]
    series: gta6                      # gta6 | gta5_last_ride | hype
    ad_disclosure: true               # paid campaigns: adds "#ad" on screen at the start, in the caption,
                                      # and turns on YouTube/TikTok paid-promotion labels
    ai_text_allowed: true             # false if the campaign bans AI content: plain template titles, no AI hook
    clip_preapproval: false           # true if each clip must be approved by the streamer before posting
    notes: "Campaign requires a credit in the first 3 seconds."
